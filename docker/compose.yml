name: khata

services:
  postgres:
    image: postgres:18
    container_name: khata-postgres
    environment:
      POSTGRES_DB: khata
      POSTGRES_USER: khata
      POSTGRES_PASSWORD: khata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - khata_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khata -d khata"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  khata_postgres_data:
