name: Binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/cli build:npm
      - run: tar -czf npm-packages.tgz -C apps/cli/dist npm
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm-packages.tgz
          retention-days: 7

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            package: cli-darwin-arm64
            node-architecture: arm64
          - runner: macos-latest
            package: cli-darwin-x64
            node-architecture: x64
          - runner: ubuntu-latest
            package: cli-linux-x64
            node-architecture: x64
          - runner: ubuntu-24.04-arm
            package: cli-linux-arm64
            node-architecture: arm64
          - runner: windows-latest
            package: cli-win32-x64
            node-architecture: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: ${{ matrix.node-architecture }}
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
      - run: tar -xzf npm-packages.tgz
      - name: Install khata from the built packages
        run: |
          mkdir smoke && cd smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../npm/khata "../npm/${{ matrix.package }}"
      - name: Smoke-test the CLI and the MCP server
        working-directory: smoke
        run: bun ../apps/cli/release/smoke-test.ts node_modules/khata/bin/khata.js
