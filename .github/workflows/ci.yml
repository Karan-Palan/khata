name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:ci

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: khata
          POSTGRES_USER: khata
          POSTGRES_PASSWORD: khata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khata -d khata"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      KHATA_TEST_POSTGRES_URL: postgres://khata:khata@127.0.0.1:5432/khata
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test apps/cli

  binaries:
    uses: ./.github/workflows/binaries.yml
