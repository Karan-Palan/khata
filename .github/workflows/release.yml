name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  binaries:
    uses: ./.github/workflows/binaries.yml

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
      - run: tar -xzf npm-packages.tgz
      - name: Check the tag matches the package version
        run: |
          version=$(jq -r .version npm/khata/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match khata $version."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm through trusted publishing, executables first
        run: |
          for directory in npm/cli-* npm/khata; do
            name=$(jq -r .name "$directory/package.json")
            version=$(jq -r .version "$directory/package.json")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm."
            else
              npm publish "$directory" --access public
            fi
          done
      - name: Attach the executables to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          for directory in npm/cli-*; do
            for binary in "$directory"/bin/*; do
              cp "$binary" "assets/khata-${directory#npm/cli-}${binary##*/khata}"
            done
          done
          (cd assets && sha256sum -- * > SHA256SUMS)
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes assets/*
          fi
